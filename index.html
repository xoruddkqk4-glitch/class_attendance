<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학급 출석부</title><style>dialog:not([open]){display:none}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="classroom.css"></head>
<body class="app-locked"><div class="app-shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">▦</span><span>학급 출석부</span></div><nav><button class="nav-item active" data-view="dashboard"><span>▣</span> 교사 대시보드</button><button class="nav-item" data-view="lesson"><span>✓</span> 수업 중 자리배치</button></nav><div class="sidebar-bottom"><button id="dataButton" class="nav-item"><span>↕</span> 데이터 관리</button><button id="firebaseButton" class="nav-item"><span>☁</span> Firebase 연결</button><p class="sync-status"><i></i><span id="syncText">이 기기에 저장됨</span></p></div></aside>
<main><header class="topbar"><button id="menuButton" class="icon-button menu-button">☰</button><div class="class-select-wrap"><span class="top-label">현재 학급</span><select id="classSelect"></select><button id="addClassButton" class="small-add" aria-label="학급 추가">＋</button></div><div class="topbar-right"><span id="todayText"></span><div class="top-actions"><button id="loadButton" class="top-action">파일에서 불러오기</button><button id="downloadButton" class="top-action">파일로 저장한 후 내려받기</button></div></div></header>
<section id="dashboard" class="view active"><div class="page-heading"><div><p class="eyebrow">관리자 대시보드</p><h1>학급 관리 및 자리 배치</h1><p class="subcopy">학생 명단과 교실 자리를 정하고, 기간별 학습 기록을 확인하세요.</p></div><div class="progress-note" data-progress-note></div></div>
<div class="dashboard-grid"><div class="content-card"><div class="card-header"><div><h2>학급 및 학생</h2><p>현재 학급의 이름과 명단을 관리합니다.</p></div><button id="addStudentButton" class="secondary-button">+ 학생 추가</button></div><label class="field-label">학급 이름<input id="classNameInput"></label><div id="studentTable" class="student-table"></div></div>
<div class="content-card"><div class="card-header"><div><h2>교실 자리 배정</h2><p>학생을 한 번씩 터치해 두 자리를 맞바꿀 수 있습니다.</p></div><button id="randomButton" class="secondary-button">↻ 랜덤 배치</button></div><div class="formation-options"><button data-formation="group"><b>모둠 대형</b><span>4인 1모둠 (2 × 2)</span></button><button data-formation="division"><b>분단 대형</b><span>3분단 × 6줄</span></button><button data-formation="exam"><b>시험 대형</b><span>6 × 6</span></button></div><div class="teacher-desk">교탁</div><div id="adminGrid" class="seating-grid edit-grid"></div><button id="saveLayoutButton" class="primary-button full-button">최종 자리 배정 저장</button></div></div>
<div class="content-card report-card"><div class="card-header"><div><h2>학생별 누적 기록</h2><p>선택한 기간의 출결과 수업 태도를 확인합니다.</p></div></div><div class="period-controls"><label>시작일<input id="startDate" type="date"></label><label>종료일<input id="endDate" type="date"></label><button id="filterRecords" class="secondary-button">조회</button></div><div id="reportTable" class="report-table"></div></div></section>
<section id="lesson" class="view"><div class="page-heading"><div><p class="eyebrow">수업 중 자리배치</p><h1>오늘 수업을 기록하세요</h1><p class="subcopy">모드를 고른 뒤 학생 카드를 터치하면 바로 기록됩니다.</p></div></div><div class="lesson-toolbar"><div class="mode-switch"><button class="active" data-mode="attendance">출석 관리 모드</button><button data-mode="attitude">학습 태도 모드</button></div><div id="attendanceControls" class="status-controls"><span>기록 상태</span><button data-status="present" class="active">출석</button><button data-status="absent">결석</button><button data-status="late">지각</button><button data-status="early">조퇴</button></div><div id="attitudeHint" hidden class="mode-hint">학생을 누르면 점수와 메모를 기록할 수 있습니다.</div><div class="perspective-switch"><button data-perspective="teacher" class="active">선생님 시점</button><button data-perspective="student">학생 시점</button></div></div><div class="summary-row" id="attendanceSummary"></div><div id="lessonClassroom" class="content-card seating-card lesson-classroom"><div class="teacher-desk classroom-desk">교탁</div><div id="seatingGrid" class="seating-grid"></div></div></section>
</main></div><dialog id="modal"><form method="dialog"><button type="button" class="modal-close" aria-label="창 닫기">×</button><div id="modalContent"></div></form></dialog><input id="fileInput" type="file" accept=".txt,.json,application/json,text/plain" hidden><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="app.js?v=20260827.1"></script></body></html>
