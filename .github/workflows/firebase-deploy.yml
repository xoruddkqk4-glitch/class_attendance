name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate with Google Cloud via GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/262787333299/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: firebase-adminsdk-fbsvc@class-attendance-98a88.iam.gserviceaccount.com

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.28.1

      - name: Deploy Hosting and Firestore rules
        run: firebase deploy --project class-attendance-98a88 --only hosting,firestore:rules
